# Production overrides. Selected explicitly via SPRING_PROFILES_ACTIVE=production.
# The base application.yaml is already hardened (ddl-auto: validate, show-sql: false,
# sql.init.mode: never, swagger disabled); this file only states production-specific
# intent and locks down anything the base/dev files could loosen by accident.
spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  flyway:
    clean-disabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  # OTEL_EXPORTER_OTLP_ENDPOINT MUST point at the production collector.
  # Keep sampling low to bound overhead and export cost; override via env if needed.
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:0.1}
  otlp:
    metrics:
      export:
        enabled: true

logging:
  level:
    root: WARN
    com.kte.backend: INFO
