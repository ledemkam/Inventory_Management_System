# Production overrides. Must be selected explicitly:
#   SPRING_PROFILES_ACTIVE=production
# The base application.yaml is already hardened (ddl-auto: validate,
# show-sql: false, swagger disabled, no credential fallbacks), so this file
# only needs to state production-specific intent and lock down anything a
# future change to the base/dev files could otherwise loosen by accident.
spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: WARN
    com.kte.backend: INFO

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
