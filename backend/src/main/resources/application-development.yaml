# Local development overrides. Active by default (spring.profiles.active in application.yaml)
# so `mvn spring-boot:run` / IDE runs work out of the box.
# Real deployments MUST set SPRING_PROFILES_ACTIVE=production to avoid these
# convenience-oriented, insecure-by-design settings.
spring:
  output:
    ansi:
      enabled: ALWAYS

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/inventory}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: true

# Dev-only fallback secret so local runs work without extra setup. NEVER used in production.
jwt:
  secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-0123456789abcdef}
  expiration: ${JWT_EXPIRATION:86400000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
  endpoint:
    health:
      show-details: always
  # Trace every request locally and push metrics to the docker-compose OTLP stack.
  tracing:
    sampling:
      probability: 1.0
  otlp:
    metrics:
      export:
        enabled: true

logging:
  level:
    root: INFO
    com.kte.backend: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.transaction: DEBUG
    org.springframework.cache: TRACE
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: '%clr(%d{yyyy-MM-dd HH:mm:ss}){faint} %clr([%thread]){blue} %clr([%X{traceId:-},%X{spanId:-}]){yellow} %clr(%-5level){highlight} %clr(%logger{36}){cyan} - %msg%n'

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
