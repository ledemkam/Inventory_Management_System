jwt:
  secret: ${jwt.secret}
  expiration: ${jwt.expiration}

spring:
  application:
    name: backend
  profiles:
    active:
      - development
  cache:
    type: simple

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1200000


  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
        order_updates: true
        order_inserts: true
    open-in-view: false


  # Flyway configuration for database migrations
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations:
      - classpath:db/migration
    schemas: public
    table: flyway_schema_history
    validate-on-migrate: true

server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
    min-response-size: 1024
    excluded-media-types: image/png,image/jpeg,image/gif,image/webp

  #Actuator configuration for monitoring and
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

# Baseline logging; overridden per-profile (see application-development.yaml / application-production.yaml)
logging:
  level:
    root: INFO
    com.kte.backend: INFO
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n'
    file: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n'

  # Springdoc OpenAPI configuration - off by default, enabled explicitly in development
springdoc:
  default-produces-media-type: application/json
  override-with-generic-response: false
  api-docs:
    enabled: false
    path: /v3/api-docs
  swagger-ui:
    enabled: false
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
