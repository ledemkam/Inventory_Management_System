spring:
  application:
    name: backend
  # No default profile on purpose: a deployment that forgets SPRING_PROFILES_ACTIVE must fail
  # fast (missing DB_URL / JWT_SECRET) instead of silently running with the insecure dev settings.
  # Local runs: `mvn spring-boot:run` activates "development" (see pom.xml), IDE run configs
  # must set SPRING_PROFILES_ACTIVE=development.
  cache:
    type: simple

  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1200000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
        order_updates: true
        order_inserts: true
    open-in-view: false

  sql:
    init:
      mode: never

  # Flyway configuration for database migrations
  flyway:
    enabled: true
    baseline-on-migrate: false
    locations:
      - classpath:db/migration
    schemas: public
    table: flyway_schema_history
    validate-on-migrate: true
    clean-disabled: true

  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:5MB}
      max-request-size: ${MAX_REQUEST_SIZE:6MB}

# Comma-separated list of front-end origins allowed to call the API (see CorsConfig).
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173,http://localhost:4200,http://127.0.0.1:4200}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

server:
  port: ${SERVER_PORT:8080}
  # Honour X-Forwarded-* headers from the hosting platform's reverse proxy (HTTPS, host, port).
  forward-headers-strategy: framework
  compression:
    enabled: true
    min-response-size: 1024
    excluded-media-types: image/png,image/jpeg,image/gif,image/webp

# Actuator configuration for health/info endpoints.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

# Baseline logging; overridden per-profile (see application-development.yaml / application-production.yaml).
logging:
  level:
    root: INFO
    com.kte.backend: INFO
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{traceId:-},%X{spanId:-}] %-5level %logger{36} - %msg%n'
    file: '%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{traceId:-},%X{spanId:-}] %-5level %logger{36} - %msg%n'

# Springdoc OpenAPI configuration - off by default, enabled explicitly in development
springdoc:
  default-produces-media-type: application/json
  override-with-generic-response: false
  api-docs:
    enabled: false
    path: /v3/api-docs
  swagger-ui:
    enabled: false
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
